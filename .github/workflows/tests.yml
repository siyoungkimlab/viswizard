name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests
        run: pytest tests -q

  syntax:
    name: tcl and shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tcl
      - name: Tcl files are complete scripts
        run: tclsh tests/tcl_complete.tcl vizard/*.tcl
      - name: Shell scripts parse
        run: bash -n install.sh

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
      - run: python -m sphinx -b html -W docs docs/_build/html

  all:
    name: all checks
    if: always()
    needs: [tests, syntax, docs]
    runs-on: ubuntu-latest
    steps:
      # One stable context for branch protection to require, so the test
      # matrix can change without reconfiguring the protected branch.
      - name: Verify every job succeeded
        run: |
          echo "tests:  ${{ needs.tests.result }}"
          echo "syntax: ${{ needs.syntax.result }}"
          echo "docs:   ${{ needs.docs.result }}"
          [ "${{ needs.tests.result }}" = "success" ] \
            && [ "${{ needs.syntax.result }}" = "success" ] \
            && [ "${{ needs.docs.result }}" = "success" ]
